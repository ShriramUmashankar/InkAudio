<!DOCTYPE html>
<!-- Restore active job status and display live generation, cancellation, and completion updates. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Podcast Studio — Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="nav"></div>
<main class="card">
  <div class="hero small">
    <div class="eq" id="hero-eq"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <h1>Generation Progress</h1>
    <p class="sub" id="status-line">Checking job status…</p>
  </div>

  <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
  <p class="muted" id="pct">0%</p>

  <div class="stepper" id="stepper">
    <span class="step" data-stage="ingest">Ingest</span><span class="step" data-stage="script_gen">Script</span><span class="step" data-stage="translation" hidden>Translate</span><span class="step" data-stage="tts">TTS</span><span class="step" data-stage="stitch">Stitch</span>
  </div>

  <p class="muted" id="meta"></p>
  <div class="alert" id="error" hidden></div>
  <button class="danger" id="terminate">Terminate</button>
  <a href="index.html" class="link" id="back" hidden>Back to Generate</a>
</main>
<script type="module">
/* Restore server job state and render live stage, progress, and cancellation updates. */
import { renderNav } from "./js/nav.js";
import { getJobStatus, terminateJob } from "./js/api.js";
import { streamEvents } from "./js/sse.js";

renderNav("progress.html");
const fill = document.getElementById("fill");
const pct = document.getElementById("pct");
const stepper = document.getElementById("stepper");
const meta = document.getElementById("meta");
const statusLine = document.getElementById("status-line");
const errorEl = document.getElementById("error");
const termBtn = document.getElementById("terminate");
const back = document.getElementById("back");

const STAGES = ["ingest", "script_gen", "translation", "tts", "stitch"];

let events;

/** Clamp progress and prevent backwards updates unless restoring a server snapshot. */
function setProgress(p, reset = false) {
  p = Math.max(0, Math.min(100, Math.round(Number(p) || 0)));
  if (reset || p >= parseInt(fill.style.width || "0", 10)) {
    fill.style.width = p + "%";
    pct.textContent = p + "%";
  }
}

/** Mark preceding stages complete and highlight the active pipeline stage. */
function setStage(stage) {
  stepper.querySelectorAll(".step").forEach((s) => {
    s.classList.toggle("done", STAGES.indexOf(s.dataset.stage) < STAGES.indexOf(stage));
    s.classList.toggle("current", s.dataset.stage === stage);
  });
}

/** Close live updates and reveal the stopped-job error and return link. */
function setError(msg) {
  events?.close();
  errorEl.textContent = msg;
  errorEl.hidden = false;
  statusLine.textContent = "Generation stopped.";
  termBtn.hidden = true;
  back.hidden = false;
}

/** Restore server lifecycle state, including translation visibility and cancellation. */
function applyStatus(state) {
  stepper.querySelector('[data-stage="translation"]').hidden = state.tts_mode !== "bodhan" || state.podcast_language === "en";
  if (state.status === "completed") {
    events?.close();
    window.location.href = "result.html";
  } else if (state.status === "failed" || state.status === "terminated") {
    setError(state.error || (state.status === "terminated" ? "Generation terminated." : "Generation failed."));
  } else if (state.status === "running") {
    setProgress(state.progress, true);
    setStage(state.stage);
    statusLine.textContent = state.cancel_requested ? "Stopping generation — waiting for the current operation…" : `Running: ${state.stage || "starting"}`;
    termBtn.disabled = !!state.cancel_requested;
  } else {
    setError("No active job.");
  }
}

/** Fetch an authoritative snapshot and expose connection loss without discarding progress. */
async function refreshStatus() {
  try {
    const response = await getJobStatus();
    if (!response.ok) throw new Error("Could not check job status.");
    applyStatus(response.body);
    return response.body;
  } catch {
    statusLine.textContent = "Connection lost. Reload to reconnect to generation.";
    return null;
  }
}

/** Subscribe to stage, turn, translation, and terminal updates for the active job. */
function run() {
  events = streamEvents({
    snapshot: applyStatus,
    // Update the active stage while preserving the cancellation status message.
    stage_start: (d) => { setStage(d.stage); setProgress(d.progress); if (!termBtn.disabled) statusLine.textContent = `Running: ${d.stage}`; },
    // Reflect the completed stage and its latest progress.
    stage_complete: (d) => { setStage(d.stage); setProgress(d.progress); },
    // Explain the pause while a speech model is being loaded.
    model_loading: () => { meta.textContent = "Loading model…"; },
    // Identify the latest synthesized host turn and advance progress.
    turn_synthesized: (d) => { meta.textContent = `Synthesized ${d.turn_id} · ${d.speaker}`; setProgress(d.progress); },
    // Show the translated-turn count and overall progress.
    translation_progress: (d) => { meta.textContent = `Translated ${d.completed_turns} / ${d.total_turns} turns`; setProgress(d.progress); },
    // Advance progress after the revision graph completes.
    revision_complete: (d) => { setProgress(d.progress); },
    // Close live updates and open the completed podcast.
    complete: () => { events?.close(); window.location.href = "result.html"; },
    // Display the server failure detail when available.
    failed: (d) => setError(d.error || "Generation failed."),
    // Show a terminal cancellation message.
    terminated: () => setError("Generation terminated."),
    done: refreshStatus,
    error: refreshStatus,
  });
}

// Restore the current snapshot before opening a stream for a running job.
(async () => {
  const state = await refreshStatus();
  if (state?.status === "running") run();
})();

// Request cancellation, then refresh status while the worker winds down.
termBtn.addEventListener("click", async () => {
  termBtn.disabled = true;
  try {
    const response = await terminateJob();
    if (!response.ok) throw new Error(response.body?.detail || "Cannot terminate now.");
    statusLine.textContent = "Stopping generation — waiting for the current operation…";
    await refreshStatus();
  } catch (error) {
    termBtn.disabled = false;
    errorEl.textContent = error.message;
    errorEl.hidden = false;
  }
});
</script>
</body>
</html>
